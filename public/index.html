<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eCOPY — Professional Card Offload</title>
  <link rel="stylesheet" href="/css/app.css?v=27" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232fe07f'/><path d='M9 16l5 5 9-11' stroke='%230b0e13' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>
  <!-- eCOPY boot splash — airport self-service terminal style (XUEZHIZHONG) -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="sp-top">
      <div class="sp-brand">
        <svg width="20" height="20" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#2fe07f"/><path d="M9 16l5 5 9-11" stroke="#0b0e13" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>eCOPY</span>
      </div>
      <div class="sp-boot-tag">SYSTEM BOOT · V1.3</div>
    </div>

    <div class="sp-center">
      <svg class="sp-logo" width="84" height="84" viewBox="0 0 32 32">
        <rect class="sp-box" width="32" height="32" rx="7" fill="#2fe07f"/>
        <path class="sp-check" d="M9 16l5 5 9-11" stroke="#0b0e13" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="sp-word">eCOPY</div>
      <div class="sp-en">PROFESSIONAL CARD OFFLOAD</div>
    </div>

    <div class="sp-foot">
      <div class="sp-status" id="spStatus">
        <span class="sp-main" id="spMain">系统初始化</span>
        <span class="sp-sub" id="spSub">SYSTEM INITIALIZATION</span>
      </div>
      <div class="sp-pct mono" id="spPct">0%</div>
      <div class="sp-rule"><i id="spFill"></i></div>
    </div>

    <div class="sp-credit">XUEZHIZHONG · 薛智中</div>
  </div>

  <div class="bgfx" aria-hidden="true"><i class="bg-orb o1"></i><i class="bg-orb o2"></i><i class="bg-orb o3"></i></div>

  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#2fe07f"/><path d="M9 16l5 5 9-11" stroke="#0b0e13" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-stack">
          <span>eCOPY</span>
          <small>PROFESSIONAL OFFLOAD</small>
        </span>
      </div>
      <button class="cmd-trigger" id="cmdTrigger" title="Command palette (Ctrl+K)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span data-i18n="cmd.placeholder">Search or run command…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="top-actions">
        <button class="icon-btn" id="bellBtn" title="Notifications" aria-label="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          <span class="bell-dot" id="bellDot" hidden></span>
        </button>
      </div>
    </header>

    <div class="shell">
      <nav class="sidebar" id="sidebar">
        <button class="nav-item" data-view="wizard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span class="nav-labels">
            <span data-i18n="nav.wizard">New Offload</span>
            <small>NEW OFFLOAD</small>
          </span>
        </button>
        <button class="nav-item" data-view="jobs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>
          <span class="nav-labels">
            <span data-i18n="nav.jobs">Jobs</span>
            <small>JOBS</small>
          </span>
        </button>
        <button class="nav-item" data-view="disks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
          <span class="nav-labels">
            <span data-i18n="nav.disks">Disks</span>
            <small>DISKS</small>
          </span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9l.1.1a1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H10a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V10a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
          <span class="nav-labels">
            <span data-i18n="nav.settings">Settings</span>
            <small>SETTINGS</small>
          </span>
        </button>
        <div class="sidebar-foot">
          <div class="status-line"><span class="dot ok" id="srvDot"></span><span id="srvText" data-i18n="srv.connected">connected</span></div>
        </div>
      </nav>

      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- Overlay layer: command palette, path browser, notification center, toasts -->
  <div class="overlay-root" id="overlayRoot"></div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script type="module" src="/js/app.js?v=27"></script>
</body>
</html>
