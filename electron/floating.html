<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:5218" />
<title>eCOPY · 拷卡进度</title>
<style>
  /* Deep-violet flat theme matching the main app (v2.1). */
  :root {
    --bg: #1a1428;
    --bg-soft: #2a2342;
    --accent: #7c5cfc;
    --accent-2: #38bdf8;
    --accent-soft: rgba(124, 92, 252, 0.18);
    --fg: #f4f2fa;
    --muted: #a7a2b8;
    --ok: #34d399;
    --warn: #fbbf24;
    --border: #3a3155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: transparent;
    color: var(--fg);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .win {
    width: 100%;
    height: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  .titlebar {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px 6px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
  }
  .titlebar .actions {
    -webkit-app-region: no-drag;
    display: flex;
    gap: 4px;
  }
  .tbtn {
    width: 22px; height: 22px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .tbtn:hover { background: rgba(255,255,255,0.1); color: var(--fg); }
  .tbtn.close:hover { background: #ef4444; color: #fff; }

  .body { padding: 4px 14px 10px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .headline {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .headline .label { font-size: 13px; color: var(--muted); }
  .headline .pct {
    font-size: 30px;
    font-weight: 700;
    color: var(--fg);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .headline .pct .unit { font-size: 16px; color: var(--muted); margin-left: 2px; }
  .bar {
    width: 100%;
    height: 6px;
    background: var(--bg-soft);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar > div {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 0;
    transition: width 0.4s ease;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .stats .ok { color: var(--ok); }
  .stats .warn { color: var(--warn); }
  .foot {
    display: flex;
    gap: 6px;
    padding: 0 14px 12px;
  }
  .fbtn {
    flex: 1;
    height: 26px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--fg);
    border-radius: 7px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .fbtn:hover { background: rgba(59,130,246,0.15); border-color: var(--accent); }
  .fbtn.primary { background: var(--accent-soft); border-color: var(--accent); color: #cfe0ff; }
  .fbtn.primary:hover { background: var(--accent); color: #fff; }
  .idle { text-align: center; color: var(--muted); font-size: 12px; padding: 18px 0; }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <div class="brand"><span class="dot"></span><span>eCOPY · 拷卡进度</span></div>
    <div class="actions">
      <button class="tbtn" id="btnMin" title="隐藏悬浮窗">—</button>
      <button class="tbtn close" id="btnClose" title="退出应用">×</button>
    </div>
  </div>
  <div class="body" id="body">
    <div class="idle" id="idle">暂无运行中的拷卡任务</div>
    <div id="active" style="display:none; gap:8px; flex-direction:column;">
      <div class="headline">
        <span class="label" id="jobLabel">0 个任务运行中</span>
        <span class="pct"><span id="pct">0.0</span><span class="unit">%</span></span>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <div class="stats">
        <span id="speed">0 B/s</span>
        <span id="eta">—</span>
      </div>
    </div>
  </div>
  <div class="foot">
    <button class="fbtn primary" id="btnRestore">显示主窗口</button>
    <button class="fbtn" id="btnQuit">退出</button>
  </div>
</div>

<script src="floating.js"></script>
</body>
</html>
